<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JANスキャン</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2c6e49">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --main:#2c6e49; --bg:#f7f9f7; --border:#d8e2dc; --danger:#c1121f; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; background:var(--bg); color:#222; }
    header { padding:14px 16px; background:var(--main); color:#fff; text-align:center; font-size:17px; font-weight:bold; }
    main { max-width:480px; margin:0 auto; padding:16px; }
    .card { padding:18px; background:#fff; border:1px solid var(--border); border-radius:10px; }
    #reader { width:100%; overflow:hidden; border-radius:8px; }
    .msg { margin-top:12px; padding:12px; border-radius:8px; font-size:15px; line-height:1.6; }
    .info { background:#eef4ee; }
    .error { background:#ffd6d6; color:var(--danger); }
    .hidden { display:none !important; }
    .manual { display:flex; gap:8px; margin-top:10px; }
    input,select { width:100%; padding:12px; font-size:16px; border:1px solid var(--border); border-radius:8px; }
    .manual input { flex:1; }
    button { padding:12px 16px; border:2px solid var(--main); border-radius:8px; background:#fff; color:var(--main); font-size:16px; cursor:pointer; }
    footer { padding:16px; color:#999; text-align:center; font-size:12px; }
  </style>
</head>
<body>
  <header>📷 JANスキャン</header>
  <main>
    <div id="setupErrorCard" class="card hidden">
      <div class="msg error">このページは、在庫管理システムの「JANスキャン」ボタンから開いてください。</div>
    </div>
    <div id="scanCard" class="card hidden">
      <div id="reader"></div>
      <div id="scanMsg" class="msg info">商品のバーコード（JANコード）をカメラにかざしてください。読み取ると自動で在庫管理システムへ戻ります。</div>
      <div id="cameraSwitcherBox" class="hidden" style="margin-top:10px;">
        <label style="display:block;margin-bottom:4px;font-size:13px;color:#666;">カメラが違う場合はこちらで切り替え</label>
        <select id="cameraSwitcherSelect" onchange="switchCamera()"></select>
      </div>
      <div class="manual">
        <input id="manualJan" type="text" inputmode="numeric" placeholder="JANコードを手入力">
        <button type="button" onclick="lookupManualJan()">決定</button>
      </div>
    </div>
  </main>
  <footer>棚卸・在庫管理システム連携ページ</footer>

  <script>
    var params = new URLSearchParams(window.location.search);
    var API_URL = params.get('api') || '';
    var TARGET = params.get('target') === 'out' ? 'out' : 'in';
    var qrScanner = null;
    var availableCameras = [];
    var isProcessing = false;
    var lastFailMessageAt = 0;

    window.onload = function () {
      if (!API_URL) {
        document.getElementById('setupErrorCard').classList.remove('hidden');
        return;
      }
      document.getElementById('scanCard').classList.remove('hidden');
      startScanning();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      }
    };

    function startScanning() {
      if (qrScanner) return;
      qrScanner = new Html5Qrcode('reader');
      var config = { fps: 10, qrbox: { width: 260, height: 160 } };
      Html5Qrcode.getCameras().then(function (devices) {
        availableCameras = devices || [];
        if (!availableCameras.length) {
          showScanMsg('この端末でカメラが見つかりませんでした。', 'error');
          return;
        }
        renderCameraSwitcher();
        startWithCameraId(pickBackCameraId(availableCameras), config);
      }).catch(function () {
        startWithFacingMode(config);
      });
    }

    function pickBackCameraId(devices) {
      var back = devices.find(function (device) {
        var label = (device.label || '').toLowerCase();
        return label.indexOf('back') !== -1 || label.indexOf('rear') !== -1 ||
          label.indexOf('environment') !== -1 || label.indexOf('背面') !== -1;
      });
      return (back || devices[devices.length - 1]).id;
    }

    function startWithCameraId(cameraId, config) {
      qrScanner.start(cameraId, config, onDecoded, onDecodeFailure).catch(function () {
        startWithFacingMode(config);
      });
    }

    function startWithFacingMode(config) {
      qrScanner.start({ facingMode: 'environment' }, config, onDecoded, onDecodeFailure)
        .catch(function (err) {
          showScanMsg('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。' +
            '（詳細: ' + (err && err.name ? err.name : '不明') + '）', 'error');
        });
    }

    function renderCameraSwitcher() {
      var box = document.getElementById('cameraSwitcherBox');
      if (availableCameras.length <= 1) return;
      box.classList.remove('hidden');
      var select = document.getElementById('cameraSwitcherSelect');
      select.innerHTML = '';
      availableCameras.forEach(function (device, index) {
        var option = document.createElement('option');
        option.value = device.id;
        option.textContent = device.label || ('カメラ' + (index + 1));
        select.appendChild(option);
      });
      select.value = pickBackCameraId(availableCameras);
    }

    function switchCamera() {
      var id = document.getElementById('cameraSwitcherSelect').value;
      var config = { fps: 10, qrbox: { width: 260, height: 160 } };
      qrScanner.stop().catch(function () {}).then(function () {
        startWithCameraId(id, config);
      });
    }

    function stopScanning() {
      if (qrScanner) {
        qrScanner.stop().catch(function () {}).then(function () {
          qrScanner = null;
        });
      }
    }

    function onDecoded(jan) {
      if (isProcessing) return;
      isProcessing = true;
      stopScanning();
      returnToApp(jan);
    }

    function onDecodeFailure() {
      var now = Date.now();
      if (now - lastFailMessageAt > 4000) {
        lastFailMessageAt = now;
        showScanMsg('バーコードを画面中央に合わせてください。', 'info');
      }
    }

    function lookupManualJan() {
      var jan = document.getElementById('manualJan').value.trim();
      if (!jan || isProcessing) return;
      isProcessing = true;
      stopScanning();
      returnToApp(jan);
    }

    /* fetchは使わない。GASとGitHub Pages間のCORSエラーを防ぐ。 */
    function returnToApp(jan) {
      try {
        var appUrl = new URL(API_URL);
        appUrl.searchParams.set('jan', jan);
        appUrl.searchParams.set('target', TARGET);
        window.location.replace(appUrl.toString());
      } catch (err) {
        isProcessing = false;
        showScanMsg('連携先URLが正しくありません。在庫管理システムから開き直してください。', 'error');
      }
    }

    function showScanMsg(text, type) {
      var box = document.getElementById('scanMsg');
      box.textContent = text;
      box.className = 'msg ' + type;
    }
  </script>
</body>
</html>
